<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Board Pro Max</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --sidebar-bg: #ffffff;
            --card-bg: #ffffff;
            --border-color: #000000;
            --green: #2ecc71;
            --red: #e74c3c;
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
            --poop: #8b4513;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            display: flex;
            background-color: var(--bg-color);
            height: 100vh;
        }

        /* Боковая панель */
        .sidebar {
            width: 240px;
            min-width: 240px;
            background: var(--sidebar-bg);
            border-right: 2px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 4px 0 10px rgba(0,0,0,0.05);
            z-index: 100;
            overflow-y: auto;
        }

        .section-title { font-weight: bold; font-size: 14px; margin-bottom: 8px; display: block; border-bottom: 1px solid #ddd; padding-top: 10px;}

        .multiplier-group { display: flex; gap: 5px; }
        .m-btn { flex: 1; padding: 10px; border: 1px solid #ccc; background: #fff; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .m-btn.active { background: #3498db; color: white; border-color: #3498db; }

        .custom-scores { display: flex; flex-wrap: wrap; gap: 5px; }
        .custom-scores input { width: 40px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; text-align: center; }
        
        .add-player-btn { background: var(--green); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .tg-btn { background: #0088cc; color: white; text-decoration: none; text-align: center; padding: 12px; border-radius: 6px; font-weight: bold; margin-top: auto; }

        /* Сетка карточек */
        .main-content {
            flex-grow: 1;
            padding: 25px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); /* Карточки стали больше */
            grid-auto-rows: min-content;
            gap: 25px;
            align-content: flex-start;
        }

        /* Карточка игрока */
        .player-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: all 0.3s ease;
            min-height: 500px;
        }

        /* Свечение для лидеров */
        .card-1 { border-color: var(--gold); box-shadow: 0 0 25px var(--gold); background: linear-gradient(180deg, #fffbeb 0%, #fff 100%); }
        .card-2 { border-color: var(--silver); box-shadow: 0 0 20px var(--silver); }
        .card-3 { border-color: var(--bronze); box-shadow: 0 0 15px var(--bronze); }
        .card-last { border-color: var(--poop); box-shadow: 0 0 15px rgba(139, 69, 19, 0.3); }

        .rank-icon { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); font-size: 32px; z-index: 10; }

        .card-header {
            padding: 15px;
            display: flex;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
        }
        .nickname-input { border: none; background: transparent; font-weight: bold; font-size: 20px; width: 100%; text-align: center; outline: none; }
        .del-btn { color: var(--red); background: none; border: none; cursor: pointer; font-size: 22px; }

        .buttons-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }
        .score-btn { padding: 14px; border: 1px solid var(--border-color); border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .plus { background: #e8f5e9; color: #2e7d32; }
        .minus { background: #ffebee; color: #c62828; }

        /* Быстрое добавление в карточке */
        .quick-add { padding: 0 15px 15px; display: flex; gap: 5px; }
        .quick-add input { flex-grow: 1; padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
        .quick-add-btn { padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; }

        .balance-sec { text-align: center; padding: 15px; border-top: 2px solid var(--border-color); background: rgba(255,255,255,0.5); }
        .balance-val { font-size: 36px; font-weight: bold; }

        .history-sec { padding: 15px; border-top: 1px solid #ddd; height: 140px; display: flex; flex-direction: column; }
        .history-log { flex-grow: 1; overflow-y: auto; font-size: 14px; background: rgba(255,255,255,0.8); padding: 8px; border: 1px solid #eee; }
        .log-p { color: var(--green); }
        .log-m { color: var(--red); }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <span class="section-title">ИЗМ. БАЛ</span>
            <div class="multiplier-group">
                <button class="m-btn active" onclick="setMult(1, this)">1X</button>
                <button class="m-btn" onclick="setMult(2, this)">2X</button>
                <button class="m-btn" onclick="setMult(3, this)">3X</button>
            </div>
        </div>

        <div>
            <span class="section-title">НАСТРОЙКА КНОПОК</span>
            <div class="custom-scores" id="btnSettings">
                <input type="number" value="10" onchange="renderBoard()">
                <input type="number" value="20" onchange="renderBoard()">
                <input type="number" value="30" onchange="renderBoard()">
                <input type="number" value="40" onchange="renderBoard()">
                <input type="number" value="50" onchange="renderBoard()">
            </div>
        </div>

        <button class="add-player-btn" onclick="addPlayer()">+ ДОБАВИТЬ ИГРОКА</button>
        
        <a href="https://t.me/ТВОЙ_КАНАЛ" target="_blank" class="tg-btn">МОЙ ТЕЛЕГРАМ</a>
    </div>

    <div class="main-content" id="board"></div>

    <script>
        let multiplier = 1;
        let players = [];

        function setMult(val, btn) {
            multiplier = val;
            document.querySelectorAll('.m-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function addPlayer() {
            const id = Date.now();
            players.push({ id, name: "Игрок", score: 0, history: [] });
            renderBoard();
        }

        function deletePlayer(id) {
            if(confirm("Удалить игрока?")) {
                players = players.filter(p => p.id !== id);
                renderBoard();
            }
        }

        function updateName(id, newName) {
            const p = players.find(p => p.id === id);
            if (p) p.name = newName;
        }

        function changeScore(id, baseVal, isPlus) {
            const player = players.find(p => p.id === id);
            const change = baseVal * multiplier * (isPlus ? 1 : -1);
            player.score += change;
            
            const logEntry = `${isPlus ? '+' : '-'}${baseVal}${multiplier > 1 ? ' (x'+multiplier+')' : ''} = ${change > 0 ? '+' : ''}${change}`;
            player.history.unshift({ text: logEntry, type: isPlus ? 'p' : 'm' });
            renderBoard();
        }

        function quickChange(id, isPlus) {
            const input = document.querySelector(`#quick-val-${id}`);
            const val = parseInt(input.value) || 0;
            if (val !== 0) changeScore(id, val, isPlus);
            input.value = '';
        }

        function renderBoard() {
            const container = document.getElementById('board');
            const inputs = document.getElementById('btnSettings').querySelectorAll('input');
            const btnValues = Array.from(inputs).map(i => parseInt(i.value) || 0);

            const sorted = [...players].sort((a, b) => b.score - a.score);
            
            container.innerHTML = players.map(p => {
                const rank = sorted.indexOf(p) + 1;
                let rankClass = '';
                let icon = '';

                if (players.length > 1) {
                    if (rank === 1) { rankClass = 'card-1'; icon = '<div class="rank-icon">👑</div>'; }
                    else if (rank === 2) { rankClass = 'card-2'; icon = '<div class="rank-icon">🥈</div>'; }
                    else if (rank === 3) { rankClass = 'card-3'; icon = '<div class="rank-icon">🥉</div>'; }
                    else if (rank === players.length) { rankClass = 'card-last'; icon = '<div class="rank-icon">💩</div>'; }
                }

                return `
                <div class="player-card ${rankClass}">
                    ${icon}
                    <div class="card-header">
                        <input type="text" class="nickname-input" value="${p.name}" oninput="updateName(${p.id}, this.value)">
                        <button class="del-btn" onclick="deletePlayer(${p.id})">×</button>
                    </div>
                    <div class="buttons-grid">
                        ${btnValues.map(v => `
                            <button class="score-btn plus" onclick="changeScore(${p.id}, ${v}, true)">+${v}</button>
                            <button class="score-btn minus" onclick="changeScore(${p.id}, ${v}, false)">-${v}</button>
                        `).join('')}
                    </div>
                    
                    <div class="quick-add">
                        <input type="number" id="quick-val-${p.id}" placeholder="Своё число">
                        <button class="quick-add-btn" style="background:var(--green)" onclick="quickChange(${p.id}, true)">+</button>
                        <button class="quick-add-btn" style="background:var(--red)" onclick="quickChange(${p.id}, false)">-</button>
                    </div>

                    <div class="balance-sec">
                        <small>БАЛАНС</small><br>
                        <div class="balance-val">${p.score}</div>
                    </div>
                    <div class="history-sec">
                        <small>ИСТОРИЯ</small>
                        <div class="history-log">
                            ${p.history.map(h => `<div class="log-${h.type}">${h.text}</div>`).join('')}
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
