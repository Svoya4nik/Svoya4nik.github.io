<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Board Pro</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --sidebar-bg: #ffffff;
            --card-bg: #ffffff;
            --border-color: #000000;
            --green: #2ecc71;
            --red: #e74c3c;
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
            --poop: #8b4513;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            display: flex;
            background-color: var(--bg-color);
            height: 100vh;
        }

        /* Боковая панель */
        .sidebar {
            width: 220px;
            min-width: 220px;
            background: var(--sidebar-bg);
            border-right: 2px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 4px 0 10px rgba(0,0,0,0.05);
            z-index: 100;
        }

        .section-title { font-weight: bold; font-size: 14px; margin-bottom: 8px; display: block; border-bottom: 1px solid #ddd; }

        .multiplier-group { display: flex; gap: 5px; }
        .m-btn { flex: 1; padding: 10px; border: 1px solid #ccc; background: #fff; cursor: pointer; border-radius: 4px; }
        .m-btn.active { background: #3498db; color: white; border-color: #3498db; }

        .custom-scores input { width: 45px; padding: 5px; margin-bottom: 5px; border: 1px solid #ccc; border-radius: 4px; text-align: center; }
        
        .add-player-btn { background: var(--green); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .add-player-btn:hover { opacity: 0.9; }

        /* Сетка карточек */
        .main-content {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); /* Адаптивность */
            grid-auto-rows: min-content;
            gap: 20px;
            align-content: flex-start;
        }

        /* Карточка игрока */
        .player-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        /* Короны и статусы */
        .rank-icon { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); font-size: 24px; z-index: 10; }
        .card-1 { border-color: var(--gold); box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); }
        .card-2 { border-color: var(--silver); }
        .card-3 { border-color: var(--bronze); }
        .card-last { border-color: var(--poop); }

        .card-header {
            padding: 10px;
            display: flex;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
        }
        .nickname-input {
            border: none;
            background: transparent;
            font-weight: bold;
            font-size: 18px;
            width: 100%;
            text-align: center;
            outline: none;
        }
        .del-btn { color: var(--red); background: none; border: none; cursor: pointer; font-size: 18px; }

        .buttons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 15px;
        }
        .score-btn {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .plus { background: #e8f5e9; color: #2e7d32; }
        .minus { background: #ffebee; color: #c62828; }

        .balance-sec {
            text-align: center;
            padding: 10px;
            border-top: 2px solid var(--border-color);
            background: #fcfcfc;
        }
        .balance-val { font-size: 28px; font-weight: bold; }

        .history-sec {
            padding: 10px;
            border-top: 1px solid #ddd;
            height: 120px;
            display: flex;
            flex-direction: column;
        }
        .history-log {
            flex-grow: 1;
            overflow-y: auto;
            font-size: 13px;
            background: #fff;
            padding: 5px;
            border: 1px solid #eee;
        }
        .log-p { color: var(--green); }
        .log-m { color: var(--red); }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <span class="section-title">ИЗМ. БАЛ</span>
            <div class="multiplier-group">
                <button class="m-btn active" onclick="setMult(1, this)">1X</button>
                <button class="m-btn" onclick="setMult(2, this)">2X</button>
                <button class="m-btn" onclick="setMult(3, this)">3X</button>
            </div>
        </div>

        <div>
            <span class="section-title">НАСТРОЙКА КНОПОК</span>
            <div class="custom-scores" id="btnSettings">
                <input type="number" value="10" onchange="updateButtonLabels()">
                <input type="number" value="20" onchange="updateButtonLabels()">
                <input type="number" value="30" onchange="updateButtonLabels()">
                <input type="number" value="40" onchange="updateButtonLabels()">
                <input type="number" value="50" onchange="updateButtonLabels()">
            </div>
        </div>

        <button class="add-player-btn" onclick="addPlayer()">+ ДОБАВИТЬ ИГРОКА</button>
    </div>

    <div class="main-content" id="board">
        </div>

    <script>
        let multiplier = 1;
        let players = [];

        function setMult(val, btn) {
            multiplier = val;
            document.querySelectorAll('.m-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function addPlayer() {
            const id = Date.now();
            players.push({ id, name: "Игрок", score: 0, history: [] });
            renderBoard();
        }

        function deletePlayer(id) {
            players = players.filter(p => p.id !== id);
            renderBoard();
        }

        function updateName(id, newName) {
            const p = players.find(p => p.id === id);
            if (p) p.name = newName;
        }

        function changeScore(id, baseVal, isPlus) {
            const player = players.find(p => p.id === id);
            const change = baseVal * multiplier * (isPlus ? 1 : -1);
            player.score += change;
            
            const logEntry = `${isPlus ? '+' : '-'}${baseVal}${multiplier > 1 ? ' (x'+multiplier+')' : ''} = ${change > 0 ? '+' : ''}${change}`;
            player.history.unshift({ text: logEntry, type: isPlus ? 'p' : 'm' });
            
            renderBoard();
        }

        function updateButtonLabels() {
            renderBoard();
        }

        function renderBoard() {
            const container = document.getElementById('board');
            const inputs = document.getElementById('btnSettings').querySelectorAll('input');
            const btnValues = Array.from(inputs).map(i => parseInt(i.value) || 0);

            // Сортировка для рейтинга
            const sorted = [...players].sort((a, b) => b.score - a.score);
            
            container.innerHTML = players.map(p => {
                const rank = sorted.indexOf(p) + 1;
                let rankClass = '';
                let icon = '';

                if (players.length > 1) {
                    if (rank === 1) { rankClass = 'card-1'; icon = '<div class="rank-icon">👑</div>'; }
                    else if (rank === 2) { rankClass = 'card-2'; icon = '<div class="rank-icon">🥈</div>'; }
                    else if (rank === 3) { rankClass = 'card-3'; icon = '<div class="rank-icon">🥉</div>'; }
                    else if (rank === players.length) { rankClass = 'card-last'; icon = '<div class="rank-icon">💩</div>'; }
                }

                return `
                <div class="player-card ${rankClass}" id="pc-${p.id}">
                    ${icon}
                    <div class="card-header">
                        <input type="text" class="nickname-input" value="${p.name}" oninput="updateName(${p.id}, this.value)">
                        <button class="del-btn" onclick="deletePlayer(${p.id})">×</button>
                    </div>
                    <div class="buttons-grid">
                        ${btnValues.map(v => `
                            <button class="score-btn plus" onclick="changeScore(${p.id}, ${v}, true)">+${v}</button>
                            <button class="score-btn minus" onclick="changeScore(${p.id}, ${v}, false)">-${v}</button>
                        `).join('')}
                    </div>
                    <div class="balance-sec">
                        <small>БАЛАНС</small><br>
                        <div class="balance-val">${p.score}</div>
                    </div>
                    <div class="history-sec">
                        <small>ИСТОРИЯ</small>
                        <div class="history-log">
                            ${p.history.map(h => `<div class="log-${h.type}">${h.text}</div>`).join('')}
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
