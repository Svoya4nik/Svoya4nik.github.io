<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Board Ultimate Fix</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --sidebar-bg: #ffffff;
            --card-bg: #ffffff;
            --text-color: #000000;
            --border-color: #000000;
            --green: #2ecc71;
            --red: #e74c3c;
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
            --poop: #8b4513;
        }

        body.dark-theme {
            --bg-color: #1a1a1a;
            --sidebar-bg: #2d2d2d;
            --card-bg: #333333;
            --text-color: #ffffff;
            --border-color: #555555;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            display: flex;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            transition: background 0.3s;
        }

        .sidebar {
            width: 260px;
            min-width: 260px;
            background: var(--sidebar-bg);
            border-right: 2px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 100;
            overflow-y: auto;
        }

        .section-title { font-weight: bold; font-size: 14px; margin-bottom: 5px; display: block; border-bottom: 1px solid #ddd; padding-top: 10px;}

        .multiplier-group { display: flex; gap: 5px; }
        .m-btn { flex: 1; padding: 12px; border: 1px solid #ccc; background: #fff; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .m-btn.active { background: #3498db; color: white; border-color: #3498db; }

        .custom-scores { display: flex; flex-wrap: wrap; gap: 5px; }
        .custom-scores input { width: 45px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; text-align: center; }
        
        .action-btn { border: none; padding: 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; color: white; }
        .add-player-btn { background: var(--green); }
        .theme-btn { background: #555; }
        .tg-btn { background: #0088cc; text-decoration: none; text-align: center; padding: 12px; border-radius: 6px; font-weight: bold; margin-top: auto; color: white; }

        .sort-toggle { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: bold; }

        .main-content {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); /* Увеличил ширину карточек */
            grid-auto-rows: min-content;
            gap: 40px;
            align-content: flex-start;
        }

        .player-card {
            background: var(--card-bg);
            border: 3px solid var(--border-color); /* Жирнее рамка */
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            min-height: 600px; /* Увеличил высоту */
        }

        /* УСИЛЕННОЕ СВЕЧЕНИЕ */
        .card-1 { border-color: var(--gold); box-shadow: 0 0 50px var(--gold); background: #fffdf0 !important; }
        body.dark-theme .card-1 { background: #443d1a !important; }
        .card-2 { border-color: var(--silver); box-shadow: 0 0 40px var(--silver); background: #f8f8f8 !important; }
        body.dark-theme .card-2 { background: #3d3d3d !important; }
        .card-3 { border-color: var(--bronze); box-shadow: 0 0 35px var(--bronze); background: #fff8f4 !important; }
        body.dark-theme .card-3 { background: #3d332a !important; }
        .card-last { border-color: var(--poop); box-shadow: 0 0 25px rgba(139, 69, 19, 0.6); }

        .rank-icon { position: absolute; top: -25px; left: 50%; transform: translateX(-50%); font-size: 42px; z-index: 10; }

        .card-header { padding: 20px; display: flex; align-items: center; border-bottom: 3px solid var(--border-color); }
        .nickname-input { border: none; background: transparent; font-weight: bold; font-size: 24px; width: 100%; text-align: center; outline: none; color: inherit; }
        
        .buttons-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 20px; flex-grow: 1; }
        .score-btn { 
            padding: 20px 10px; /* Кнопки стали больше, текст по центру */
            border: 2px solid var(--border-color); 
            border-radius: 12px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 20px; 
            transition: 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .score-btn:active { transform: scale(0.92); }
        .plus { background: #e8f5e9; color: #2e7d32; }
        .minus { background: #ffebee; color: #c62828; }

        .quick-add { padding: 0 20px 20px; display: flex; gap: 10px; }
        .quick-add input { flex-grow: 1; padding: 12px; border: 2px solid #ccc; border-radius: 8px; font-size: 16px; }

        .balance-sec { text-align: center; padding: 20px; border-top: 3px solid var(--border-color); background: rgba(0,0,0,0.03); }
        .balance-val { font-size: 48px; font-weight: bold; }

        .history-sec { padding: 20px; border-top: 1px solid #ddd; height: 160px; display: flex; flex-direction: column; }
        .history-log { flex-grow: 1; overflow-y: auto; font-size: 16px; background: rgba(255,255,255,0.05); padding: 10px; border: 1px solid rgba(0,0,0,0.1); }
    </style>
</head>
<body class="dark-theme">

    <div class="sidebar">
        <button class="action-btn theme-btn" onclick="toggleTheme()">🌓 ПЕРЕКЛЮЧИТЬ ТЕМУ</button>
        
        <div>
            <span class="section-title">ИЗМЕНЕНИЕ БАЛЛОВ</span>
            <div class="multiplier-group">
                <button class="m-btn active" onclick="setMult(1, this)">1X</button>
                <button class="m-btn" onclick="setMult(2, this)">2X</button>
                <button class="m-btn" onclick="setMult(3, this)">3X</button>
            </div>
        </div>

        <div>
            <span class="section-title">НАСТРОЙКА КНОПОК</span>
            <div class="custom-scores" id="btnSettings">
                <input type="number" value="10" onchange="renderBoard()">
                <input type="number" value="20" onchange="renderBoard()">
                <input type="number" value="30" onchange="renderBoard()">
                <input type="number" value="40" onchange="renderBoard()">
                <input type="number" value="50" onchange="renderBoard()">
            </div>
        </div>

        <div>
            <span class="section-title">ОПЦИИ</span>
            <label class="sort-toggle">
                <input type="checkbox" id="sortEnabled" onchange="renderBoard()"> Авто-сортировка
            </label>
        </div>

        <button class="action-btn add-player-btn" onclick="addPlayer()">+ ДОБАВИТЬ ИГРОКА</button>
        
        <a href="https://t.me/ТВОЙ_КАНАЛ" target="_blank" class="tg-btn">МОЙ ТЕЛЕГРАМ</a>
    </div>

    <div class="main-content" id="board"></div>

    <script>
        let multiplier = 1;
        let players = [];

        function toggleTheme() { document.body.classList.toggle('dark-theme'); }

        function setMult(val, btn) {
            multiplier = val;
            document.querySelectorAll('.m-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function addPlayer() {
            players.push({ id: "p" + Date.now(), name: "Игрок", score: 0, history: [] });
            renderBoard();
        }

        function deletePlayer(id) {
            if(confirm("Удалить игрока?")) {
                players = players.filter(p => p.id !== id);
                renderBoard();
            }
        }

        function updateName(id, newName) {
            const p = players.find(p => p.id === id);
            if (p) p.name = newName;
        }

        function changeScore(id, baseVal, isPlus) {
            const player = players.find(p => p.id === id);
            if (!player) return;

            const change = baseVal * multiplier * (isPlus ? 1 : -1);
            player.score += change;
            player.history.unshift({ 
                text: `${isPlus ? '+' : '-'}${baseVal}${multiplier > 1 ? ' (x'+multiplier+')' : ''} = ${change > 0 ? '+' : ''}${change}`, 
                type: isPlus ? 'p' : 'm' 
            });
            renderBoard();
        }

        function quickChange(id, isPlus) {
            const input = document.querySelector(`#quick-val-${id}`);
            const val = parseInt(input.value) || 0;
            if (val !== 0) changeScore(id, val, isPlus);
            input.value = '';
        }

        function renderBoard() {
            const container = document.getElementById('board');
            const btnValues = Array.from(document.getElementById('btnSettings').querySelectorAll('input')).map(i => parseInt(i.value) || 0);
            const isSortEnabled = document.getElementById('sortEnabled').checked;

            const sortedByScore = [...players].sort((a, b) => b.score - a.score);
            let displayPlayers = isSortEnabled ? sortedByScore : [...players];

            container.innerHTML = displayPlayers.map(p => {
                const rank = sortedByScore.indexOf(p) + 1;
                let rankClass = ''; let icon = '';

                if (players.length > 1) {
                    if (rank === 1) { rankClass = 'card-1'; icon = '<div class="rank-icon">👑</div>'; }
                    else if (rank === 2) { rankClass = 'card-2'; icon = '<div class="rank-icon">🥈</div>'; }
                    else if (rank === 3) { rankClass = 'card-3'; icon = '<div class="rank-icon">🥉</div>'; }
                    else if (rank === players.length) { rankClass = 'card-last'; icon = '<div class="rank-icon">💩</div>'; }
                }

                return `
                <div class="player-card ${rankClass}">
                    ${icon}
                    <div class="card-header">
                        <input type="text" class="nickname-input" value="${p.name}" oninput="updateName('${p.id}', this.value)">
                        <button class="del-btn" onclick="deletePlayer('${p.id}')">×</button>
                    </div>
                    <div class="buttons-grid">
                        ${btnValues.map(v => `
                            <button class="score-btn plus" onclick="changeScore('${p.id}', ${v}, true)">+${v}</button>
                            <button class="score-btn minus" onclick="changeScore('${p.id}', ${v}, false)">-${v}</button>
                        `).join('')}
                    </div>
                    <div class="quick-add">
                        <input type="number" id="quick-val-${p.id}" placeholder="Своё число">
                        <button class="m-btn" style="background:var(--green);color:white;border:none" onclick="quickChange('${p.id}', true)">+</button>
                        <button class="m-btn" style="background:var(--red);color:white;border:none" onclick="quickChange('${p.id}', false)">-</button>
                    </div>
                    <div class="balance-sec">
                        <small>БАЛАНС</small><br>
                        <div class="balance-val">${p.score}</div>
                    </div>
                    <div class="history-sec">
                        <small>ИСТОРИЯ</small>
                        <div class="history-log">
                            ${p.history.map(h => `<div style="color: ${h.type === 'p' ? 'var(--green)' : 'var(--red)'}">${h.text}</div>`).join('')}
                        </div>
                    </div>
                </div>`;
            }).join('');
        }
    </script>
</body>
</html>
