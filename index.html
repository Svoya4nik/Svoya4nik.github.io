<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Counter</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .controls {
            margin-bottom: 30px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        input, button {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: white;
            margin: 5px;
        }
        button {
            cursor: pointer;
            background: #3d5afe;
            border: none;
            transition: 0.2s;
        }
        button:hover {
            background: #536dfe;
        }
        .player-card {
            background: #1e1e1e;
            padding: 15px;
            margin: 10px;
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid #3d5afe;
        }
        .player-info {
            flex-grow: 1;
        }
        .score {
            font-size: 24px;
            font-weight: bold;
            color: #00e676;
            margin-right: 20px;
        }
        .btn-group button {
            padding: 5px 10px;
            font-size: 12px;
            background: #424242;
        }
        .btn-group button:hover {
            background: #616161;
        }
    </style>
</head>
<body>

    <h2>Таблица баллов</h2>

    <div class="controls">
        <input type="text" id="playerName" placeholder="Имя игрока">
        <button onclick="addPlayer()">Добавить игрока</button>
        <hr style="border: 0.5px solid #333; margin: 15px 0;">
        <div>
            <small>Настройка кнопок баллов (через пробел):</small><br>
            <input type="text" id="btnSettings" value="10 20 30 40 50">
            <button onclick="updateButtons()" style="background: #ef6c00;">Обновить кнопки</button>
        </div>
    </div>

    <div id="playersList"></div>

    <script>
        let scoreValues = [10, 20, 30, 40, 50];

        function addPlayer() {
            const nameInput = document.getElementById('playerName');
            const name = nameInput.value.trim();
            
            if (name === "") return;

            const playerCard = document.createElement('div');
            playerCard.className = 'player-card';
            
            playerCard.innerHTML = `
                <div class="player-info">
                    <strong>${name}</strong>
                </div>
                <div class="score" id="score-${name}">0</div>
                <div class="btn-group" id="btns-${name}">
                    ${renderButtons(name)}
                </div>
                <button onclick="this.parentElement.remove()" style="background:#c62828; margin-left: 10px;">❌</button>
            `;

            document.getElementById('playersList').appendChild(playerCard);
            nameInput.value = "";
        }

        function renderButtons(playerName) {
            return scoreValues.map(val => 
                `<button onclick="changeScore('${playerName}', ${val})">+${val}</button>`
            ).join('');
        }

        function changeScore(playerName, amount) {
            const scoreElement = document.getElementById(`score-${playerName}`);
            let currentScore = parseInt(scoreElement.innerText);
            scoreElement.innerText = currentScore + amount;
        }

        function updateButtons() {
            const settings = document.getElementById('btnSettings').value;
            scoreValues = settings.split(' ').map(Number).filter(n => !isNaN(n));
            
            // Обновляем кнопки у всех уже созданных игроков
            const allBtnGroups = document.querySelectorAll('.btn-group');
            allBtnGroups.forEach(group => {
                const name = group.id.replace('btns-', '');
                group.innerHTML = renderButtons(name);
            });
        }
    </script>
</body>
</html>
